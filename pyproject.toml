[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedxmag"
version = "0.1.0"
description = "Normal-support graph representation learning for anomaly detection"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.7",
    "torch>=2.14,<2.15",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Hash-bound by data/processed/xiiotid_stage1_v3b_audit_band/manifest.json.
"scripts/build_audit_band.py" = ["E501"]

