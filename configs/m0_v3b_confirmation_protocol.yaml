protocol:
  name: xiiotid_stage1_m0_v3b_independent_confirmation
  version: 1
  registered_on: "2026-10-24"
  status: confirmatory
  claim: >-
    Under identical dependency-closed masks and exactly equal capacity, true
    edge-aware topology improves masked reconstruction of every v3b target
    family on untouched future normal windows beyond local, unordered
    set-context, and both-endpoint-shuffled adjacency information.

