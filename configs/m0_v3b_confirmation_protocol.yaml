# Copied from the base configuration and re-asserted by the runner.
model_seeds: [17, 29, 41, 53, 67]
confirmation_mask_seeds: [1000003, 1000033, 1000037, 1000039, 1000081, 1000099,
  1000117, 1000121, 1000133, 1000151, 1000159, 1000171, 1000183,
  1000187, 1000193, 1000199, 1000211, 1000213, 1000231, 1000249,
  1000253, 1000273, 1000289, 1000291, 1000303]
predictors: [local, set_context, shuffled_graph, graph]

support_requirements:
  minimum_confirmation_normal_graphs: 100
  minimum_mask_target_rate_per_family: 0.001
  minimum_mask_stratum_available_scalars: 100
  minimum_target_scalars_per_degree_stratum_across_masks: 100
  minimum_target_graphs_per_degree_stratum_across_masks: 30

gates:
  minimum_graph_gain_over_local: 0.05
  minimum_graph_gain_over_set_context: 0.05
  minimum_graph_gain_over_shuffled_graph: 0.05
  require_graph_better_than_constant: true
  maximum_standardized_graph_mse: 1.0

decision_rule: >-
  For each family, MSE is the graph-balanced masked MSE on the confirmation
  partition, averaged over the 25 confirmation masks and then over the five
  model seeds; Constant is evaluated once on the same masks. A family passes
  only if Graph beats Constant, Graph MSE is at most 1.0, and Graph improves
  by at least 5% over Local, Set-context, and Shuffled graph separately. M0
  passes only if all four families pass. No family may be removed, no gate
  may be changed, and no model, mask, seed, or feature may be re-selected
  after the confirmation partition is opened.

secondary_descriptive_analyses:
  bootstrap_resamples: 2000
  bootstrap_seed: 20261024
  bootstrap_cluster: session_key
  interval: 0.95
